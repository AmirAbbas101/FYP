{% extends '_base.html' %} {% load static %}
{% block title %}
Jobs
{% endblock title %}
{% block content %}

<section class="py-12 px-6 lg:px-32">
    <div class="container mx-auto grid grid-cols-1 md:grid-cols-4 gap-6">
        <!-- Filters -->
        <aside
            class="hidden md:block p-6 md:col-span-1 sticky top-5 min-h-[300px] md:min-h-[auto] transition-all duration-300 ease-in-out"
            id="filter-section">
            <img src="{% static 'imgs/poster.png' %}" alt="poster" class="w-[300px] h-[600px]">
        </aside>
        <!-- Job Listings -->
        <main class="md:col-span-3 p-2">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6">Add New Job</h2>
            {% include 'jobs/post-job-form.html' %}
        </main>
    </div>
</section {% endblock content %}
